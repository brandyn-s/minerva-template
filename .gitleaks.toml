[extend]
useDefault = true

[[allowlists]]
description = "Git-ignored generated and local-only paths outside the reviewable working tree"
paths = [
  '''(^|/)\.git/''',
  '''(^|/)node_modules/''',
  '''(^|/)\.next/''',
  '''(^|/)\.vercel/''',
  '''(^|/)\.env\.local$''',
  '''(^|/)evaluation-artifacts/''',
  '''(^|/)evidence/private/'''
]
