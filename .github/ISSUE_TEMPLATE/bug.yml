name: Bug report
description: Report reproducible behavior that does not match the current contract.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities or include secrets, private workspace content, or participant data here. Follow SECURITY.md instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what user outcome did it prevent?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest repeatable sequence, including the starting state.
      placeholder: |
        1. Start from ...
        2. Perform ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: State the relevant contract and how the observation differs.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA, branch, or release where you observed the problem.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, Node version, and any non-sensitive details that matter.
  - type: textarea
    id: evidence
    attributes:
      label: Minimal evidence
      description: Add sanitized logs or screenshots only when they help reproduce the behavior.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I have removed secrets, private content, transcripts, and participant data.
          required: true
