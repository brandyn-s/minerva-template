name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up exact npm
        run: |
          npm install --global npm@12.0.2
          test "$(npm --version)" = "12.0.2"

      - name: Install verified gitleaks binary
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          bin_dir="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "${bin_dir}"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar --extract --gzip --file "${archive}" --directory "${bin_dir}" gitleaks
          chmod 0755 "${bin_dir}/gitleaks"
          echo "${bin_dir}" >> "${GITHUB_PATH}"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run security:audit

      - name: Check source
        run: npm run check

      - name: Check operational helpers
        run: npm run test:ops

      - name: Scan Git history and current contents
        run: npm run secrets:scan
